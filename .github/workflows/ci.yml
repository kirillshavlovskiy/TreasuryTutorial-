name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  ECR_REPOSITORY: fx-test-project
  HELM_RELEASE: fx-test-project
  HELM_NAMESPACE: fx-test-project
  HELM_CHART: ./helm

jobs:
  build:
    name: Build & Push Docker Image
    runs-on:
      group: default
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::211125331032:role/github-actions-common"
          aws-region: eu-west-1

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "false"

      - name: Set image metadata
        id: meta
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG=${{ github.sha }}
          IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-to: type=inline

  deploy:
    name: Update Helm image tag
    needs: build
    runs-on:
      group: default

    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.DEPLOYER_APP_ID }}
          private-key: ${{ secrets.DEPLOYER_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Update image tag in Helm values
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          sed -i "s|^    tag:.*|    tag: ${{ needs.build.outputs.image_tag }}|" values.yaml
          git config user.name "deployer"
          git config user.email "deployer@users.noreply.github.com"
          git add values.yaml
          git diff --cached --quiet || git commit -m "[skip ci]: update image tag to ${{ needs.build.outputs.image_tag }}"
          git push