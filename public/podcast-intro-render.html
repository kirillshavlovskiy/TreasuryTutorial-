<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Sigma — 3D Z render frame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #020617; }
    .stage {
      width: 1920px; height: 1080px;
      background:
        radial-gradient(ellipse 80% 60% at 50% 42%, #1e293b 0%, transparent 55%),
        linear-gradient(180deg, #0f172a 0%, #020617 100%);
      position: relative;
    }
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 20%, transparent 75%);
    }
    .scene {
      position: absolute;
      left: 50%; top: 42%;
      width: 320px; height: 320px;
      margin: -160px 0 0 -160px;
      perspective: 900px;
    }
    .card {
      position: absolute; inset: 20px;
      border-radius: 28px;
      background: transparent;
      display: grid; place-items: center;
      transform-style: preserve-3d;
      filter: drop-shadow(0 0 28px rgba(56, 189, 248, 0.2))
              drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55));
    }
    .card img {
      width: 100%; height: 100%;
      object-fit: contain;
      transform: translateZ(1px);
      border-radius: 22%;
    }
    .brand {
      position: absolute; left: 0; right: 0; top: 640px;
      text-align: center; color: #e2e8f0;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .brand h1 {
      font-size: 32px; font-weight: 550; letter-spacing: 0.02em;
      max-width: 1100px; margin: 0 auto; line-height: 1.35; padding: 0 40px;
    }
    .formula {
      position: absolute; color: rgba(148, 163, 184, 0.45);
      font: 22px/1.2 "SF Mono", Menlo, Consolas, monospace;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <div class="scene">
      <div class="card" id="card">
        <img src="simple-sigma-logo.png" alt="Simple Sigma" />
      </div>
    </div>
    <div class="brand">
      <h1>Corporate Treasury — from basics to modern practical navigation</h1>
    </div>
    <div class="formula" style="left:80px;top:100px">H* = P × (1 + σ_P × Φ⁻¹(1 − Δr / r_OD))</div>
    <div class="formula" style="left:1180px;top:160px">VaR₉₅ = |pos| × σ × √21 × 1.645</div>
    <div class="formula" style="left:100px;top:900px">Δr = r_USD − r_FCY</div>
    <div class="formula" style="left:1400px;top:860px">I + J = 0</div>
    <div class="formula" style="left:1200px;top:960px">CIP: r_f = r_USD + (F−S)/S</div>
  </div>
  <script>
    // angle in degrees from ?a= or #a=
    const params = new URLSearchParams(location.search);
    const hash = location.hash.replace(/^#/, '');
    const hashParams = new URLSearchParams(hash.startsWith('a=') ? hash : 'a=' + (hash || '0'));
    const deg = Number(params.get('a') ?? hashParams.get('a') ?? 0) || 0;
    // 3D: tilt on X so Z-axis spin has foreshortening (not a flat 2D roll)
    document.getElementById('card').style.transform =
      `rotateX(22deg) rotateZ(${deg}deg)`;
  </script>
</body>
</html>
