{{- if .Values.publicIngress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.sandboxName }}-public
  namespace: {{ .Values.sandboxName }}
  labels:
    app.kubernetes.io/name: {{ .Values.sandboxName }}-public
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    {{- if .Values.publicIngress.whitelistSourceRange }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.publicIngress.whitelistSourceRange }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.publicIngress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.sandboxName }}-app
                port:
                  number: {{ .Values.service.port }}
{{- end }}
