{{- if .Values.database.backup }}
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: {{ .Values.sandboxName }}-backup-s3
  namespace: {{ .Values.sandboxName }}
spec:
  name: {{ .Values.sandboxName }}-backup-s3
  description: "S3 write access for {{ .Values.sandboxName }} database backups — restricted to s3://{{ .Values.s3.bucket }}/{{ .Values.sandboxName }}/db_backup/*"
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "AllowBackupUpload",
          "Effect": "Allow",
          "Action": [
            "s3:PutObject",
            "s3:GetObject",
            "s3:DeleteObject"
          ],
          "Resource": "arn:aws:s3:::{{ .Values.s3.bucket }}/{{ .Values.sandboxName }}/db_backup/*"
        },
        {
          "Sid": "AllowListBucket",
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket"
          ],
          "Resource": "arn:aws:s3:::{{ .Values.s3.bucket }}"
        }
      ]
    }
---
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: {{ .Values.sandboxName }}-backup-s3
  namespace: {{ .Values.sandboxName }}
spec:
  name: {{ .Values.sandboxName }}-backup-s3
  description: "IRSA role for {{ .Values.sandboxName }} database backup S3 access"
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Federated": "arn:aws:iam::{{ .Values.s3.accountId }}:oidc-provider/{{ .Values.s3.oidcIssuer }}"
          },
          "Action": "sts:AssumeRoleWithWebIdentity",
          "Condition": {
            "StringEquals": {
              "{{ .Values.s3.oidcIssuer }}:sub": "system:serviceaccount:{{ .Values.sandboxName }}:{{ .Values.sandboxName }}-pg",
              "{{ .Values.s3.oidcIssuer }}:aud": "sts.amazonaws.com"
            }
          }
        }
      ]
    }
  policies:
    - arn:aws:iam::{{ .Values.s3.accountId }}:policy/{{ .Values.sandboxName }}-backup-s3
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.sandboxName }}-backup
  namespace: {{ .Values.sandboxName }}
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  cluster:
    name: {{ .Values.sandboxName }}-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: s3-store
spec:
  configuration:
    destinationPath: s3://{{ .Values.s3.bucket }}/{{ .Values.sandboxName }}/db_backup/
    s3Credentials:
      inheritFromIAMRole: true
    wal:
      compression: gzip
    data:
      compression: gzip
{{- end }}  